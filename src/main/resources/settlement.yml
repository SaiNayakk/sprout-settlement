# Configuration for the settlement service. Named settlement.yml (not application.yml) so several services can
# share one JVM host without their settings colliding.
spring:
  application:
    name: sprout-settlement
  datasource:
    url: ${SETTLEMENT_DB_URL:jdbc:postgresql://localhost:5432/sprout?currentSchema=settlement}
    username: ${SETTLEMENT_DB_USER:sprout}
    password: ${SETTLEMENT_DB_PASSWORD:sprout}
    hikari:
      maximum-pool-size: 5
      pool-name: settlement
      connection-timeout: 2000   # fail fast when the database is gone (CHAOS-01's lesson)
      validation-timeout: 1000
  flyway:
    locations: classpath:db/settlement
    schemas: settlement
    default-schema: settlement
  jackson:
    default-property-inclusion: non_null   # absent, never null: the contracts say so
    deserialization:
      fail-on-unknown-properties: true
  jmx:
    enabled: false

server:
  port: ${SETTLEMENT_PORT:8112}
  address: ${SETTLEMENT_BIND:127.0.0.1}
  tomcat:
    threads:
      max: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 15s
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_ENABLED:false}   # send traces to a collector only when one runs
  tracing:
    enabled: true   # always carry the trace onward (W3C traceparent), even when nothing collects it
    sampling:
      probability: 1.0
  metrics:
    tags:
      service: sprout-settlement

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

sprout:
  settlement:
    every: ${SETTLEMENT_EVERY:5s}           # how often unfinished settlements are moved along
    service-key: ${SPROUT_SERVICE_KEY:dev-only-service-key}
    clearing:
      webhook-secret: ${CLEARING_SPROUT_WEBHOOK_SECRET:dev-only-clearing-webhook-secret}
    oms:
      url: ${SETTLEMENT_OMS_URL:http://127.0.0.1:8109}
    ledger:
      url: ${SETTLEMENT_LEDGER_URL:http://127.0.0.1:8106}
    bank:
      url: ${SETTLEMENT_BANK_URL:http://127.0.0.1:8107}
      partner-key: ${BANK_SPROUT_PARTNER_KEY:dev-only-partner-key}
